name: Source checks only (NO APP PACKAGING)
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python source tests, no binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q engine tests
      - name: Run isolated source-only tests
        env:
          PYTHONPATH: engine
        run: python -m unittest discover -s tests -v

  no-packaging:
    name: Packaging policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ban packaging steps in this CI workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/source-check.yml').read_text()
          banned = ('assembleDebug', 'assembleRelease', 'packageDistribution', 'flutter build', 'pyinstaller ')
          assert not any(k in s for k in banned), 'Packaging command found in source CI'
          print('PASS: source-only gate has no app packaging instructions')
          PY
